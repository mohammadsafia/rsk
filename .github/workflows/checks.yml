# The kit's own checks, on every push to main and every pull request: format, lint and types (vp check), the tests
# (vp test) and the component docs' lint. starter-verify.yml checks the starters built from this repository; this
# checks the repository itself. Read-only: no secrets, no pushes.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# A newer push to the same branch replaces a check still running for an older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The starter tests name the kit commit (git rev-parse HEAD); one commit is enough.
          fetch-depth: 1
          persist-credentials: false

      # The pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A few tests (the first-load budget's URL handling) drive headless Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Format, lint and types
        run: pnpm exec vp check

      - name: Tests
        run: pnpm exec vp test run

      - name: Component docs lint
        run: pnpm docs:lint
