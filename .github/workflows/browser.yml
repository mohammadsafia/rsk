# Behaviour tests in a real browser (tests/visual, tagged @behaviour): the keyboard and focus faults a simulated DOM
# cannot show. They take no screenshot, so they need no per-platform baseline and run on every pull request.
name: browser

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Behaviour tests
        run: pnpm browser:test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: visual-report/
