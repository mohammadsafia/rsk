# Publishes the generated starters, each to its own repository, so `vp create github:mohammadsafia/rsk-starter -- my-app`
# (Vite) and `vp create github:mohammadsafia/rsk-next-starter -- my-app` (Next) always have the latest kit. Nothing is
# pushed unless that starter's `pnpm starter:verify` passes; one failing doesn't stop the other.
name: Starter sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: starter-sync-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: vite, repo: rsk-starter, key: STARTER_DEPLOY_KEY }
          - { target: next, repo: rsk-next-starter, key: NEXT_STARTER_DEPLOY_KEY }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # The pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The first-load budget (and the accessibility audit) drive headless Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the ${{ matrix.target }} starter (type check, lint, tests, build, first-load budget)
        run: pnpm starter:verify -- --target ${{ matrix.target }}

      - name: Build the starter
        run: pnpm starter:build --target ${{ matrix.target }} "$RUNNER_TEMP/starter"

      # The deploy key is loaded only now, after the starter verified and built.
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets[matrix.key] }}

      - name: Clone ${{ matrix.repo }}
        run: git clone --depth 1 git@github.com:mohammadsafia/${{ matrix.repo }}.git "$RUNNER_TEMP/publish"

      - name: Commit the starter
        run: pnpm starter:publish "$RUNNER_TEMP/starter" "$RUNNER_TEMP/publish"

      # A no-op when the previous step reported "starter unchanged". --follow-tags sends the kit/<sha> tag that apps'
      # kit:update merges against.
      - name: Push
        run: git -C "$RUNNER_TEMP/publish" push --follow-tags origin HEAD:main
